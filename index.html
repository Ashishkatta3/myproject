<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Desert Horizon</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
    }

    .background {
      position: absolute;
      width: 100%;
      height: 100%;
      background: url('pexels-pixabay-273886.jpg') center/cover no-repeat;
      z-index: 1;
    }

    .title {
      position: absolute;
      top: 18%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 15rem;
      font-weight: bold;
      font-family: 'Playfair Display', serif;
      color: white;
      z-index: 2;
      text-shadow: 2px 2px 10px rgba(0,0,0,0.6);
    }
    .foreground-shape {
      position: absolute;
      width: 100%;
      height: 100%;
      background-color: red;
      clip-path: polygon(29% 8%, 32% 18%, 31% 70%, 22% 70%);
      z-index: 3;
      pointer-events: none;
    }

    
  </style>
</head>
<body>
  <div class="background"></div>
  <div class="title">TERAVIA</div>
  <div class="foreground-shape"></div>
</body>
</html>
