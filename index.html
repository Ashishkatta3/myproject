<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Desert Horizon</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
    }

    .background {
      position: absolute;
      width: 100%;
      height: 100%;
      background: url('/mnt/data/pexels-pixabay-273886.jpg') center/cover no-repeat;
      z-index: 1;
    }

    .title {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 6rem;
      font-weight: bold;
      color: white;
      z-index: 2;
      text-shadow: 2px 2px 10px rgba(0,0,0,0.6);
    }

    .foreground-shape {
      position: absolute;
      width: 100%;
      height: 100%;
      background: url('/mnt/data/pexels-pixabay-273886.jpg') center/cover no-repeat;
      clip-path: polygon(50% 0%, 70% 20%, 100% 30%, 100% 100%, 0% 100%, 0% 30%, 30% 20%);
      z-index: 3;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="background"></div>
  <div class="title">Welcome</div>
  <div class="foreground-shape"></div>
</body>
</html>
