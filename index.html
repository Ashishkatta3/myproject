<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Desert Horizon</title>
  <link href='https://fonts.googleapis.com/css?family=Cinzel Decorative' rel='stylesheet'>
  <link href='https://fonts.googleapis.com/css?family=Cormorant Upright' rel='stylesheet'>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
    }

    .background {
      position: absolute;
      width: 100%;
      height: 100%;
      background: url('pexels-pixabay-273886.jpg') center/cover no-repeat;
      z-index: 1;
    }

    .title {
      position: absolute;
      top: 17%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 15rem;
      font-weight: bold;
      font-family: 'Cinzel Decorative';
      color: white;
      z-index: 2;
      text-shadow: 2px 2px 10px rgba(0,0,0,0.6);
    }

    .subtext {
      position: absolute;
      top: 56%;
      left: 73%;
      transform: translateX(-50%);
      font-size: 2.5rem;
      font-weight: bold;
      font-family: 'Cormorant Upright';
      color: white;
      z-index: 2;
      text-shadow: 2px 2px 10px rgba(0,0,0,0.6);
    }

    .foreground-shape {
      position: absolute;
      width: 100%;
      height: 100%;
      background: url('pexels-pixabay-273886.jpg') center/cover no-repeat;
      clip-path: polygon(28.5% 9%, 29.9% 30%, 35% 70%, 23% 70%, 23.5% 60%);
      z-index: 3;
      pointer-events: none;
    }

    .explore-btn {
      background-color: transparent;
      border: 2px solid white;  /* Change to black or any color if your background is light */
      color: white;
      font-size: 1.5rem;
      font-family: 'Cormorant Upright';
      padding: 12px 38px;
      border-radius: 15px;
      top: 65%;
      left: 50%;
      cursor: pointer;
      position: absolute;
      letter-spacing: 1px;
      z-index: 4;
      transform: translateX(-50%);
    }

    .explore-btn:hover {
      background-color: white;
      color: black;
      box-shadow: 0 0 10px rgba(255,255,255,0.4);
}

    
  </style>
</head>
<body>
  <div class="background"></div>
  <div class="title">TERAVIA</div>
  <div class="foreground-shape"></div>
  <div class="subtext">Travel Smarter. Anywhere.</div>
  <button class="explore-btn">EXPLORE</button>
</body>
</html>
